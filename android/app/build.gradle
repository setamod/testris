plugins { id 'com.android.application' }

def releaseInfo = new groovy.json.JsonSlurper().parse(file('../../publication/release-config.json'))
def appInfo = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def signingFile = rootProject.file('keystore.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

def monetization = new groovy.json.JsonSlurper().parse(file('../../config/monetization.json'))
def localConfig = file('../../monetization.local.json')
if (localConfig.exists()) monetization.putAll(new groovy.json.JsonSlurper().parse(localConfig))
def safeString = { value -> groovy.json.JsonOutput.toJson(value ?: '') }

android {
    namespace 'com.mertbekisoglu.bulusko'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mertbekisoglu.bulusko'
        minSdk 26
        targetSdk 36
        versionCode releaseInfo.build as int
        versionName appInfo.version
        buildConfigField 'String', 'PREMIUM_PRODUCT', safeString(monetization.productId)
        buildConfigField 'boolean', 'STORE_ENABLED', String.valueOf(monetization.storeProductsEnabled == true)
        buildConfigField 'String', 'BILLING_PUBLIC_KEY', safeString(monetization.androidBillingPublicKey)
        buildConfigField 'boolean', 'LIVE_ADS_ENABLED', String.valueOf(monetization.liveAdsEnabled == true && monetization.audienceApproved == true && monetization.privacyDeclarationsApproved == true)
        testInstrumentationRunner 'com.mertbekisoglu.bulusko.SmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    // All six in-app languages must work offline after a single install.
    bundle { language { enableSplit = false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'; versionNameSuffix '-debug'
            buildConfigField 'String', 'REWARDED_ID', '"ca-app-pub-3940256099942544/5224354917"'
            manifestPlaceholders = [adMobAppId:'ca-app-pub-3940256099942544~3347511713']
        }
        release {
            buildConfigField 'String', 'REWARDED_ID', safeString(monetization.liveAdsEnabled == true ? monetization.androidRewardedAdUnitId : '')
            manifestPlaceholders = [adMobAppId:monetization.androidAdMobAppId ?: 'ca-app-pub-0000000000000000~0000000000']
            minifyEnabled false
            debuggable false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

// Refuse a requested signed publication build rather than silently using a debug key.
tasks.register('verifyReleaseSigning') {
    doLast {
        if (!signingFile.exists()) throw new GradleException('Create ignored keystore.properties using the documented owner-controlled upload key. No debug key may be used for publication.')
        ['storeFile','storePassword','keyAlias','keyPassword'].each { if (!signingValues[it]) throw new GradleException('Missing release signing field: ' + it) }
    }
}
tasks.register('storeBundle') { dependsOn 'verifyReleaseSigning'; dependsOn 'bundleRelease' }
tasks.configureEach { if (name == 'bundleRelease') mustRunAfter 'verifyReleaseSigning' }

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}

tasks.register('verifyMonetizationRelease') {
    doLast {
        if (!monetization.audienceApproved || !monetization.privacyDeclarationsApproved || !monetization.storeProductsEnabled) throw new GradleException('Complete owner audience/privacy/store gates before publication.')
        if (monetization.liveAdsEnabled && (!monetization.androidAdMobAppId || !monetization.androidRewardedAdUnitId || monetization.androidRewardedAdUnitId.contains('3940256099942544'))) throw new GradleException('Production ad IDs required; test IDs forbidden.')
        if (!monetization.androidBillingPublicKey) throw new GradleException('Play Billing purchase-verification public key required.')
    }
}
tasks.named('storeBundle') { dependsOn 'verifyMonetizationRelease' }

<!doctype html>
<html lang="tr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#10121d">
 <meta name="description" content="Popzuno: dört yönde kaydır, 3’lü sıra kur, Bomb, Rocket, Cross ve Nova kazan. Ailenin yüzleriyle yükselen bir arcade bulmacası.">
 <title>Popzuno — Photo Match &amp; Blast</title>
 <link rel="icon" type="image/svg+xml" href="./icon.svg">
 <link rel="stylesheet" href="./style.css">
 <link rel="stylesheet" href="./arcade-refresh.css">
</head>
<body class="tide-experience">
 <svg class="svg-library" aria-hidden="true"><defs>
  <symbol id="icon-family" viewBox="0 0 24 24"><circle cx="8" cy="7" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-4a6 6 0 0 1 12 0v4m2-7a5 5 0 0 1 6 5v2"/></symbol>
  <symbol id="icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 1 1 4 3c-1 1-1 2-1 3m0 3v.1"/></symbol>
  <symbol id="icon-sound" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
  <symbol id="icon-mute" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5zm5 5 6 6m0-6-6 6"/></symbol>
  <symbol id="icon-rotate" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 7M20 4v7h-7"/></symbol>
  <symbol id="icon-wave" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></symbol>
  <symbol id="icon-hint" viewBox="0 0 24 24"><path d="M8 17h8m-7 4h6M7 12a7 7 0 1 1 10 0l-2 3H9z"/></symbol>
  <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M3 5v7h7M3 12l5-5a8 8 0 1 1-1 12"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m5 5 14 14m0-14L5 19"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M3 12h17m-6-6 6 6-6 6"/></symbol>
  <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
 </defs></svg>
 <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
 <div class="app-shell">
  <header class="topbar">
   <a class="brand" href="./index.html" aria-label="Popzuno">
    <img class="brand-mark" src="./assets/popzuno-mark.png" width="43" height="43" alt="">
    <span><b data-text="brand">Popzuno</b><small data-text="tagline">SWIPE. MATCH. UNLEASH.</small></span>
   </a>
   
   <nav class="top-actions" aria-label="Oyun menüsü">
    <button class="family-button" id="family-open"><svg><use href="#icon-family"/></svg><span data-text="family">Ailem</span></button>
    <button class="icon-button" id="sound-toggle" aria-label="Ses" aria-pressed="true"><svg><use href="#icon-sound"/></svg></button>
    <button class="icon-button" id="help-open" aria-label="Nasıl oynanır"><svg><use href="#icon-help"/></svg></button>
   </nav>
  </header>
  <main id="tide-root"></main>

 </div>
 <dialog id="help-dialog" class="panel-dialog help-dialog">
  <div class="dialog-head"><h2 id="help-panel-title"></h2><button class="icon-button" data-close="help-dialog" aria-label="Kapat"><svg><use href="#icon-close"/></svg></button></div>
  <section id="help-content">
   <nav class="help-topic-tabs" aria-label="Playbook"><button type="button" data-help-topic="basics" data-text="controlsTab" aria-pressed="true"></button><button type="button" data-help-topic="powers" data-text="powersTab" aria-pressed="false"></button><button type="button" data-help-topic="modes" data-text="modesTab" aria-pressed="false"></button></nav>
   <section data-help-view="basics" id="help-basics"><ol class="help-steps"><li data-text="helpOne"></li><li data-text="helpTwo"></li><li data-text="helpFour"></li></ol><details class="overdrive-guide" id="overdrive-guide"><summary data-text="driveTitle"></summary><p data-text="driveHelp"></p></details><details class="keyboard-note"><summary data-text="keyboardTitle"></summary><p data-text="keys"></p></details></section>
   <section data-help-view="powers" id="help-powers" hidden><div id="help-patterns" class="help-patterns"></div></section>
   <section data-help-view="modes" id="help-modes" hidden></section>
  </section>
  <section id="settings-content" hidden><div class="settings">
   <label><span data-text="language"></span><select id="language"><option value="tr">Türkçe</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option><option value="de">Deutsch</option><option value="ru">Русский</option></select></label>
   <label><span data-text="sound"></span><input id="audio-toggle" type="checkbox" checked></label><label><span data-text="musicToggle"></span><input id="music-toggle" type="checkbox" checked></label><label><span data-text="volume"></span><input id="volume" type="range" min="0" max="100" value="50"></label>
   <label><span data-text="cheersToggle"></span><input id="cheers-toggle" type="checkbox" checked></label><label><span data-text="cheerVolume"></span><input id="cheer-volume" type="range" min="0" max="100" value="40"></label>
   <details class="settings-diagnostics"><summary data-text="audioTests"></summary><div class="audio-previews"><button type="button" id="power-preview" class="secondary-button" data-text="powerPreview"></button><button type="button" id="reward-preview" class="secondary-button" data-text="rewardPreview"></button><button type="button" id="cheer-preview" class="secondary-button" data-text="cheerPreview"></button></div></details>
  </div><div class="settings-links"><button id="native-settings" class="secondary-button" data-text="nativeSettings" hidden></button><button id="privacy-open" class="secondary-button"></button><a id="support-email" class="secondary-button" href="mailto:mertbek@gmail.com?subject=Popzuno"><span data-text="supportLabel"></span><small>mertbek@gmail.com</small></a><button type="button" class="secondary-button" data-help-panel="help" data-text="helpTitle"></button></div></section>
  <button class="primary-button dialog-done" data-close="help-dialog" data-text="done"></button>
 </dialog>
 <dialog id="family-dialog" class="panel-dialog family-dialog">
  <div class="dialog-head"><h2 data-text="family"></h2><button class="icon-button" data-close="family-dialog" aria-label="Kapat"><svg><use href="#icon-close"/></svg></button></div>
  <p class="dialog-copy" data-text="familyCopy"></p><div id="family-tabs" class="family-tabs"></div>
  <div class="person-editor"><img id="person-preview" alt=""><div class="person-fields"><input id="person-name" type="text" maxlength="24" aria-label="Karakter adı"><label class="upload-button"><span data-text="addPhoto"></span><input type="file" id="person-photo" accept="image/jpeg,image/png,image/webp,image/heic"></label><button id="person-delete" class="delete-button" data-text="delete"></button></div></div>
  <div class="crop-controls"><label><span data-text="zoom"></span><input id="crop-zoom" type="range" min="1" max="3" step=".02" value="1"></label><label><span data-text="horizontal"></span><input id="crop-x" type="range" min="0" max="1" step=".01" value=".5"></label><label><span data-text="vertical"></span><input id="crop-y" type="range" min="0" max="1" step=".01" value=".5"></label><label><span><span data-text="rotation"></span> <output id="crop-angle-value">0.0°</output></span><input id="crop-rotation" type="range" min="-12" max="12" step=".5" value="0"></label><button id="crop-auto" class="secondary-button crop-auto" data-text="autoAlign"></button></div>
  <p id="photo-status" class="photo-status" role="status"></p><p class="privacy-note" data-text="privacy"></p><p class="local-note" data-text="onlyLocal"></p><button class="primary-button" data-close="family-dialog" data-text="done"></button>
 </dialog>
 <dialog id="privacy-dialog" class="panel-dialog privacy-dialog" aria-labelledby="privacy-title">
  <div class="dialog-head"><span class="eyebrow">POPZUNO</span><button class="icon-button" data-close="privacy-dialog" aria-label="Kapat"><svg><use href="#icon-close"/></svg></button></div>
  <h2 id="privacy-title"></h2><div id="privacy-content"></div>
  <h3 id="credits-title"></h3><div id="license-content"></div>
  <button id="reset-open" class="delete-button"></button><button id="privacy-done" class="primary-button" data-close="privacy-dialog"></button>
 </dialog>
 <dialog id="reset-dialog" class="panel-dialog" aria-labelledby="reset-title">
  <h2 id="reset-title"></h2><p id="reset-copy"></p><p id="reset-error" role="status"></p>
  <button id="reset-confirm" class="delete-button"></button><button id="reset-cancel" class="primary-button" data-close="reset-dialog"></button>
 </dialog>
 <div id="app-notice" class="toast app-notice" role="status" aria-live="polite"></div>
 <script type="module" src="./app.mjs"></script>
</body>
</html>
